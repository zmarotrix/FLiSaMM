name: Release

# Push a tag like v1.0.0 to build FLiSaMM.exe and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm FLiSaMM.spec
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/FLiSaMM.exe --title "FLiSaMM $GITHUB_REF_NAME" --generate-notes
